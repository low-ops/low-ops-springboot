server.port=${PORT:8000}
server.shutdown=immediate

spring.application.name=springboot-app
spring.jmx.enabled=false
spring.main.banner-mode=off

spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration,\
  org.springframework.boot.sql.init.autoconfigure.SqlInitializationAutoConfiguration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.defaults.enabled=false
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

logging.pattern.console=[%level] %logger{36}: %msg%n
logging.level.lowops=INFO
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.tomcat=INFO
